@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#101114;--panel:#17191e;--panel2:#1d2026;--line:#2a2c32;--text:#f4f4f5;--muted:#9799a3;--soft:#c7c8ce;--accent:#c7f36a;--accent-dark:#9ecb41;--radius:15px;--font:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--display:'Space Grotesk',var(--font);--shadow:0 20px 55px rgba(0,0,0,.45)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button,input{font:inherit}p{margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.site-shell{max-width:1440px;margin:0 auto;padding:0 42px}.notice-bar{display:flex;align-items:center;justify-content:center;gap:10px;height:32px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#f8f9fb;background:rgba(149,133,255,.08);border-bottom:1px solid var(--line)}.notice-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px rgba(199,243,106,.85)}.notice-separator{opacity:.4}.notice-muted{color:var(--muted)}.site-header{display:flex;align-items:center;gap:30px;height:86px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;color:#fff}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#d8ff79,#b2ff8d 35%,#a481ff 100%);color:#111;font-weight:700}.brand span:last-child{display:flex;flex-direction:column;line-height:1;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.04em}.brand-accent{color:#b8ff66}.brand small{margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:1.8px;font-family:var(--font);font-weight:700}.main-nav{display:flex;align-items:center;gap:26px;margin-left:auto}.main-nav a{color:var(--muted);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;transition:color .2s ease}.main-nav a:hover,.main-nav a.active{color:#fff}.header-search{display:flex;align-items:center;gap:8px;width:240px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.02);transition:border-color .2s ease,background .2s ease}.header-search:focus-within{border-color:#59606d;background:rgba(255,255,255,.03)}.search-icon{font-size:18px;color:var(--muted)}.header-search input{flex:1;height:38px;background:transparent;border:0;color:#fff;outline:none}.header-search input::placeholder{color:#7e828b}.header-search button{width:26px;height:26px;border:0;border-radius:50%;background:#1f2228;color:#dfe1e7;cursor:pointer}.menu-toggle{display:none;border:0;background:transparent;color:#fff;font-size:24px;cursor:pointer}.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.45fr);min-height:480px;margin:26px 0 20px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#12151b}.hero-art{position:absolute;inset:0}.hero-art img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.04)}.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,16,.84) 0%,rgba(11,13,16,.58) 32%,rgba(11,13,16,.12) 68%,rgba(11,13,16,.42) 100%)}.hero-content{position:relative;z-index:1;padding:48px 42px 32px 42px;display:flex;flex-direction:column;justify-content:flex-end}.hero-kicker{display:flex;align-items:center;gap:12px;color:#dfe1e7;font-size:10px;letter-spacing:2.2px;text-transform:uppercase}.kicker-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(199,243,106,.8)}.kicker-rule{display:block;flex:1;height:1px;max-width:90px;background:rgba(255,255,255,.22)}.hero h1{margin:18px 0 12px;max-width:440px;font-family:var(--display);font-size:clamp(2.6rem,5vw,4.4rem);line-height:.9;letter-spacing:-.06em}.hero-tagline{font-size:1.08rem;color:#dfe2e9;max-width:440px}.hero-meta{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:16px;color:#dfe2e9}.hero-meta span{padding:7px 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(6,8,10,.18);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.hero-rating{display:inline-flex;align-items:center;gap:6px}.hero-description{max-width:500px;margin-top:18px;color:rgba(242,244,248,.8);font-size:1rem}.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:24px}.primary-button,.secondary-button,.text-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;border:1px solid transparent;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;transition:transform .2s ease,opacity .2s ease,border-color .2s ease}.primary-button{background:linear-gradient(180deg,#d9ff7c,#baf052);color:#12151a}.secondary-button{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.03);color:#f2f4f8}.text-link{padding:0;border:0;color:#dfe2e9;text-transform:none;letter-spacing:0}.primary-button:hover,.secondary-button:hover,.text-link:hover{transform:translateY(-1px)}.hero-index{position:absolute;right:22px;bottom:18px;display:flex;align-items:center;gap:10px;color:#dfe2e9;font-size:13px;letter-spacing:.2em;text-transform:uppercase;z-index:1}.hero-index span:first-child,.hero-index span:last-child{font-size:24px;font-weight:700;letter-spacing:-.05em}.index-line{display:block;height:1px;width:58px;background:rgba(255,255,255,.2)}.hero-index small{display:block;max-width:72px;line-height:1.2}.hero-bottom-label{position:absolute;left:42px;bottom:26px;color:rgba(255,255,255,.72);font-size:11px;letter-spacing:2.2px;text-transform:uppercase;z-index:1}.section-block{padding:22px 0 40px}.catalog-block{padding-top:10px}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 18px}.eyebrow{display:inline-block;margin-bottom:10px;color:#a7acb8;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700}.section-heading h2{margin:0;font-family:var(--display);font-size:clamp(2rem,3vw,3rem);letter-spacing:-.05em}.section-subtitle{margin-top:10px;color:var(--muted);max-width:560px}.filter-group{margin:18px 0 0}.filter-group-label{display:block;margin:0 0 8px;color:#777a84;font-size:9px;font-weight:700;letter-spacing:1.5px}.filter-row{display:flex;flex-wrap:wrap;gap:10px}.filter-chip{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.02);color:#dbe0e7;font-size:12px;transition:border-color .2s ease,background .2s ease,color .2s ease}.filter-chip.selected{border-color:rgba(199,243,106,.55);background:rgba(199,243,106,.12);color:#fff}.poster-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:26px}.movie-card{display:block;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#171a20;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.movie-card:hover{transform:translateY(-2px);border-color:#343a48;box-shadow:var(--shadow)}.poster-wrap{position:relative;aspect-ratio:3/4.52;background:#0f1114}.poster-wrap img{width:100%;height:100%;object-fit:cover}.quality-badge{position:absolute;right:12px;top:12px;padding:6px 8px;border-radius:999px;background:rgba(16,17,20,.7);border:1px solid rgba(255,255,255,.12);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.featured-badge{position:absolute;left:12px;top:12px;padding:6px 8px;border-radius:999px;background:rgba(199,243,106,.2);border:1px solid rgba(199,243,106,.4);color:#edf9bc;font-size:9px;letter-spacing:.14em;text-transform:uppercase}.poster-hover{position:absolute;inset:auto 14px 14px 14px;padding:10px 12px;border-radius:12px;background:rgba(13,15,18,.76);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .2s ease}.movie-card:hover .poster-hover{opacity:1}.movie-info{padding:15px 16px 16px}.movie-subline,.card-bottom,.metadata{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.movie-info h3{margin:12px 0 10px;font-size:1.35rem;letter-spacing:-.04em}.movie-genres{color:#d8dfe9;font-size:12px}.card-rating{display:inline-flex;align-items:center;gap:5px;color:#f4f6fa}.card-rating b{color:#ffcf5e}.catalog-footnote{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footnote-icon{color:#c7f36a}.breadcrumbs{display:flex;align-items:center;gap:10px;margin:18px 0 20px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.detail-layout{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:34px;padding:18px 0 10px}.detail-poster{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#111418}.detail-poster img{width:100%;height:100%;object-fit:cover}.poster-badge{position:absolute;right:14px;top:14px;padding:7px 9px;border-radius:999px;background:rgba(14,16,18,.72);border:1px solid rgba(255,255,255,.12);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.detail-copy h1{margin:8px 0 12px;font-family:var(--display);font-size:clamp(2.4rem,4vw,4.3rem);line-height:.94;letter-spacing:-.06em}.detail-tagline{font-size:1.06rem;color:#e8ebf2}.eyebrow-line{display:inline-block;width:56px;height:1px;background:rgba(255,255,255,.22);vertical-align:middle;margin-left:10px}.metadata{justify-content:flex-start;flex-wrap:wrap;margin-top:18px}.metadata i{display:block;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.35)}.detail-rating{display:flex;align-items:center;gap:12px;margin-top:18px;padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.02)}.star{font-size:2rem;color:#ffcf5e}.detail-rating strong{font-size:2rem}.rating-caption{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.14em}.detail-synopsis{margin-top:20px;color:rgba(242,244,248,.83);font-size:1rem;max-width:60ch}.genre-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.genre-list a{padding:8px 12px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.02);font-size:12px;color:#e6ebf4}.detail-copy .primary-button{margin-top:26px}.legal-note{margin-top:12px;color:var(--muted);font-size:12px}.related-block{padding-top:28px}.related-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:20px}.empty-state{padding:46px 26px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);text-align:center}.empty-icon{font-size:2.2rem}.empty-state h3{margin:12px 0 10px;font-size:2rem}.empty-state p{color:var(--muted);margin-bottom:18px}.site-footer{display:flex;flex-direction:column;gap:20px;padding:28px 0 42px;border-top:1px solid var(--line)}.footer-top,.footer-bottom{display:flex;justify-content:space-between;align-items:center;gap:18px}.footer-brand{flex-shrink:0}.site-footer p{color:var(--muted);max-width:420px}.footer-contact{display:inline-flex;align-items:center;gap:8px;color:#f3f6fb}.footer-bottom{padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex-wrap:wrap}.@media(min-width:1300px){.poster-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.hero{height:500px}.hero-content{padding-top:70px}}@media(max-width:1050px){.site-shell{padding:0 3.5%}.site-header{gap:24px}.main-nav{gap:16px}.header-search{width:175px}.hero-content{padding-left:38px}.hero-bottom-label{left:38px}.poster-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detail-layout{grid-template-columns:1fr}.footer-top,.footer-bottom{flex-direction:column;align-items:flex-start}}@media(max-width:820px){.site-header{height:auto;min-height:75px;flex-wrap:wrap;justify-content:space-between;padding:16px 0}.brand{font-size:20px}.menu-toggle{display:block;order:2}.main-nav{display:none;position:absolute;top:76px;left:0;width:100%;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#101114;flex-direction:column;align-items:flex-start;gap:14px;z-index:10}.main-nav.open{display:flex}.header-search{order:3;width:100%;margin-top:6px}.hero{grid-template-columns:1fr}.hero-content{padding:42px 26px 26px}.hero h1{max-width:100%}.poster-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.related-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.site-shell{padding:0 18px}.notice-bar{font-size:9px;gap:6px;white-space:nowrap;overflow:hidden}.notice-muted{overflow:hidden;text-overflow:ellipsis}.site-header{gap:12px}.brand span:last-child{font-size:16px}.brand small{letter-spacing:.1em}.hero-index{display:none}.poster-grid,.related-grid{grid-template-columns:1fr}.hero{min-height:420px}.section-heading h2{font-size:2rem}.main-nav{top:72px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

/* Static GitHub Pages version: small additions for the filter groups and loading states. */
.filter-group{margin:18px 0 0}.filter-group-label{display:block;color:#777a84;font-size:9px;font-weight:700;letter-spacing:1.5px;margin:0 0 8px}.loading-state{padding:80px 20px;text-align:center;color:#dfe1e7}.site-header .brand small{display:block}.text-link:hover{opacity:.8}
